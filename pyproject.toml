[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-demo"
version = "0.1.0"
description = "Agentic AI Demo"
requires-python = ">=3.9"

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pandas>=2.0.0",
    "langgraph>=0.6.11",
    "langchain>=0.3.30",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.86",
    "mysql-connector-python>=8.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.128.8",
    "uvicorn>=0.23.0",
    "pytest>=8.4.2",
]

[tool.setuptools]
packages = []
